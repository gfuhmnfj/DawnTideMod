#物品
item.dawntide-Quartz.name = 石英
item.dawntide-Quartz.description = 用于多种运输用建筑及电气元件上。
item.dawntide-Quartz.details = 纯度较高的二氧化硅晶体，质硬，一般也可用于冶炼硅。
item.dawntide-Iron.name = 铁
item.dawntide-Iron.description = 用于生产铁基类合金
item.dawntide-Iron.details = 鬼知道塞普罗地壳中的铁去哪了，害的我们才在这颗星球的地壳上找到行星上的铁矿。
item.dawntide-Uranium.name = 铀
item.dawntide-Uranium.description = 用于核燃料，也可用于制造坚硬的装甲。
item.dawntide-Uranium.details = 比钍更好的核燃料，至少我们可以用控制棒防爆了。
item.dawntide-Steel.name = 钢
item.dawntide-Steel.description = 用于大多数建筑的结构中。
item.dawntide-Steel.details = 基于铁的铁碳合金，加入多种金属可改善钢的性质。
item.dawntide-CeramicGlass.name = 陶瓷玻璃
item.dawntide-CeramicGlass.description = 可用于一些单位的装甲与绝缘材料。
item.dawntide-CeramicGlass.details = 热能坩埚意外生产出的物品，其兼具玻璃的可加工性和陶瓷的高强度与耐热性。
item.dawntide-BoundaryBreakingAlloy.name = 临界合金
item.dawntide-BoundaryBreakingAlloy.description = 用于高级建筑与单位
item.dawntide-BoundaryBreakingAlloy.details = 分析废墟中的材料和数据来合成的合金，其坚韧并耐用。
item.dawntide-Barite.name = 重晶石
item.dawntide-Barite.description = 不明确该矿物有哪些用处
item.dawntide-Barite.details = 该行星上特有的矿物，暂时不知道其成分是什么。
item.dawntide-HighExplosive.name = 高爆炸药
item.dawntide-HighExplosive.description = 用作爆破性弹药与炸弹。
item.dawntide-HighExplosive.details = 为什么他们把燃烧混合物称为硫化物？这里面的硫成分都可以当做杂质了。
item.dawntide-OreCrystallization.name = 矿石结晶
item.dawntide-OreCrystallization.description = 作为前线与后勤的重要战略资源，是不可缺少的一位
item.dawntide-OreCrystallization.details = 这东西五颜六色的，他们能拿这东西干嘛
item.dawntide-fibrousFat.name = 纤维凝脂
item.dawntide-fibrousFat.description = 更好的建筑材料，但极难采集
item.dawntide-fibrousFat.details = 他们利用可以快速凝结的特点去用在地下室研究
item.dawntide-fluxAlloy.name = 通量合金
item.dawntide-fluxAlloy.description = 带正荷电的合金叫通电合金，不稳定的物质叫无量合金，所以带电又不稳定叫通量合金
item.dawntide-BlueCrystal.name = 蓝晶
item.dawntide-BlueCrystal.description = 泛用炮塔弹药，伤害极高
item.dawntide-BlueCrystal.details = 带着这物品足迹他们研究了一种物质叫氰化钠的物品
item.dawntide-TitaniumSilver.name = 钛银
item.dawntide-TitaniumSilver.description = 泛用墙体，可给墙体加强
item.dawntide-TitaniumSilver.details = 在那里我们采集了少量的物质并带回去研究
item.dawntide-RefinedTitaniumSilver.name = 精炼钛银
item.dawntide-RefinedTitaniumSilver.description = 泛用墙体，可给墙体加强
item.dawntide-RefinedTitaniumSilver.details = 他们应该还有更先进的足迹

#液体
liquid.dawntide-vulcanizing.name = 硫化液
liquid.dawntide-vulcanizing.description = 可与其他物质溶解
liquid.dawntide-MicroscaleFluid.name = 微米流体
liquid.dawntide-MicroscaleFluid.description = 泛用在修复，修复的质量高达微米级

#工厂
block.dawntide-ExplosivesFactory.name = 炸药加工厂
block.dawntide-ExplosivesFactory.description = 使用硫化物和孢子夹进行冲压，产生高爆炸药
block.dawntide-ExplosivesFactory.details = 获取他们的配方后第一时间进行量产
block.dawntide-BariteFurnace.name = 重晶石熔炉
block.dawntide-BariteFurnace.description = 使用钛和玻璃进行冶炼，产生重晶石
block.dawntide-ThermonuclearFurnace.name = 热核熔炉

block.dawntide-ThermonuclearFurnace.description = 将多种材料放进里面搅拌，形成临界合金
block.dawntide-SulfideElectrolysisCell.name = 硫化物电解室
block.dawntide-SulfideElectrolysisCell.description = 将多种材料与水电解可以量产硫化物
block.dawntide-SlagCooler.name = 矿渣冷却机
block.dawntide-SlagCooler.description = 将高温矿渣超速冷却降温得到冷冻液
block.dawntide-SlagCooler.details = 他们居然有这么先进的科技
block.dawntide-CrystalSynthesizer.name = 结晶合成机
block.dawntide-CrystalSynthesizer.description = 将多种材料高压电解，与矿渣冷却得到结晶
block.dawntide-CrystalSynthesizer.details = 他们应该还有更先进的足迹
block.dawntide-CompositeSiliconPlant.name = 复合硅厂
block.dawntide-CompositeSiliconPlant.description = 将更多沙子，煤炭和硫一起熔炼更多的硅
block.dawntide-ForgingFurnace.name = 锻钢炉
block.dawntide-ForgingFurnace.description = 将铁精炼成钢
block.dawntide-ForgingFurnace.details = 新物质钢就是不错打不穿
block.dawntide-GlazeKiln.name = 镀瓷凿炉
block.dawntide-GlazeKiln.description = 硅和玻璃混合制造城的陶瓷玻璃

